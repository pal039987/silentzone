name: Auto Build & Publish APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > silentzone-release.jks

      - name: Build Signed Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Read App Version Name
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="2.0"; fi
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/release/app-release.apk "SilentZone-v${VERSION_NAME}-release.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: SilentZone v${{ steps.version.outputs.name }}
          body: |
            Automated signed release build for **SilentZone v${{ steps.version.outputs.name }}**.
            - Download `SilentZone-v${{ steps.version.outputs.name }}-release.apk` below to install or upload to Indus Appstore.
          files: SilentZone-v${{ steps.version.outputs.name }}-release.apk
          generate_release_notes: true
